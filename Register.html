<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        
        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daftar Akun</h1>
        <p class="subtitle">Silakan lengkapi data untuk mendaftar</p>
        
      <form id="registerForm" onsubmit="return false;">
            <div class="form-group">
                <label for="name">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            
            <div class="form-group">
                <label for="confirm">Konfirmasi Password</label>
               <input type="password" id="confirmPassword" name="confirm" required>
            </div>
            
            <button type="submit">Daftar</button>
        </form>
        
        <div class="login-link">
            Sudah punya akun? <a href="Login.html">Login di sini</a>
        </div>
    </div>
    
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://jmiyovocrlemxjvxpzde.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptaXlvdm9jcmxlbXhqdnhwemRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyNjE2MzYsImV4cCI6MjA4NzgzNzYzNn0.ef_TkY4Rc_TK4ZFjeeRsQejjNbhYZieX17xt65mjluI';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const registerForm = document.querySelector('#registerForm');
  const notification = document.createElement('div');
  notification.id = 'notification';
  notification.style.display = 'none';
  notification.style.padding = '12px';
  notification.style.borderRadius = '5px';
  notification.style.marginBottom = '20px';
  notification.style.textAlign = 'center';
  notification.style.fontWeight = 'bold';
  registerForm.prepend(notification);

  const showNotification = (message, isError = false) => {
    notification.textContent = message;
    notification.style.display = 'block';
    notification.style.background = isError ? '#f8d7da' : '#d4edda';
    notification.style.color = isError ? '#842029' : '#0f5132';
  };

  const validateForm = (nama, email, password, confirmPassword) => {
    if (!nama || !email || !password || !confirmPassword) {
      showNotification('Semua field harus diisi.', true);
      return false;
    }
    if (password.length < 6) {
      showNotification('Password minimal 6 karakter.', true);
      return false;
    }
    if (password !== confirmPassword) {
      showNotification('Password dan konfirmasi password tidak cocok.', true);
      return false;
    }
    return true;
  };

  registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const nama = document.getElementById('nama').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (!validateForm(nama, email, password, confirmPassword)) {
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = 'Sedang mendaftar...';

    try {
      const { data, error } = await supabaseClient
        .from('users')
        .insert([{ nama_lengkap: nama, email: email, password: password }]);

      if (error) {
        showNotification('Gagal daftar: ' + error.message, true);
        submitButton.disabled = false;
        submitButton.textContent = 'Daftar';
      } else {
        showNotification('Pendaftaran berhasil! Mengalihkan ke halaman login...', false);
        setTimeout(() => {
          window.location.href = 'Login.html';
        }, 2000);
      }
    } catch (err) {
      showNotification('Terjadi kesalahan: ' + err.message, true);
      submitButton.disabled = false;
      submitButton.textContent = 'Daftar';
    }
  });
</script>
</body>

</html>
