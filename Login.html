<style>
:root{
    --bg:#f3f6fb;
    --card:#fff;
    --accent:#2563eb;
    --muted:#7b8aa3;
    --text:#0f172a;
}

body{
    margin:0;
    font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    background:var(--bg);
    color:var(--text);
    display:flex;
    min-height:100vh;
    align-items:center;
    justify-content:center;
    padding:32px;
    box-sizing:border-box;
}

/* Card */
.login-card{
    width:360px;
    background:var(--card);
    box-shadow:0 6px 22px rgba(13, 27, 48, .12);
    border-radius:12px;
    padding:28px 24px;
}

/* Title */
.login-card h1{
    margin:0 0 18px 0;
    font-size:20px;
    letter-spacing:-0.2px;
}

/* Field container (complements existing .field label rules) */
.field{
    position:relative;
    margin:18px 0;
}

/* Input: leave space for absolute label (label left:46px in existing CSS) */
.field input{
    width:100%;
    padding:14px 12px 12px 46px;
    font-size:14px;
    border:1px solid #e6eef8;
    border-radius:8px;
    background:transparent;
    outline:none;
    transition: box-shadow .12s, border-color .12s;
    color:var(--text);
}

/* Focus and filled states that move the label (do not repeat .field label rule) */
.field.focused input{
    box-shadow:0 6px 18px rgba(37,99,235,.08);
    border-color:rgba(37,99,235,.18);
}
.field.focused > label,
.field.filled > label{
    transform:translateY(-10px) scale(.92);
    opacity:1;
    top:-8px; /* nudges the label up when focused/filled */
    font-size:11px;
    color:var(--accent);
}

/* Button */
.btn{
    width:100%;
    padding:12px;
    margin-top:6px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
}
.btn:active{ transform:translateY(1px); }
.small{
    margin-top:12px;
    font-size:13px;
    text-align:center;
    color:var(--muted);
}
</style>

<body>
    <main class="login-card" role="main" aria-labelledby="login-title">
        <h1 id="login-title">Masuk</h1>

        <form id="loginForm" autocomplete="on" novalidate>
            <div class="field">
                <input id="username" name="username" type="text" autocomplete="username" required />
                <label for="username">Username</label>
            </div>

            <div class="field">
                <input id="password" name="password" type="password" autocomplete="current-password" required />
                <label for="password">Password</label>
            </div>

            <button type="submit" class="btn">Login</button>

              </form>  
                <div class="small">Belum punya akun? <a href="Register.html">Daftar di sini</a></div>
       
    </main>

<script>
document.querySelectorAll('.field input').forEach(input=>{
    const parent = input.parentElement;
    // initialize filled state if value present (helps after autofill)
    if(input.value.trim()) parent.classList.add('filled');

    input.addEventListener('focus', ()=> parent.classList.add('focused'));
    input.addEventListener('blur', ()=>{
        parent.classList.remove('focused');
        if(input.value.trim()) parent.classList.add('filled');
        else parent.classList.remove('filled');
    });

    // support input event to set filled while typing/pasting
    input.addEventListener('input', ()=> {
        if(input.value.trim()) parent.classList.add('filled');
        else parent.classList.remove('filled');
    });
});

// simple submit handler (replace with real auth)
document.getElementById('loginForm').addEventListener('submit', e=>{

    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if(!u || !p){ alert('Isi semua bidang.'); return; }
    alert('Login diproses untuk ' + u);
    // implement real login request here
});
</script>
</body>

}

/* Slightly intensify highlight on hover for a polished feel */
